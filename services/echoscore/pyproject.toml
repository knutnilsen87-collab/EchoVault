[project]
name = "echovault-echoscore"
version = "0.2.0"
description = "EchoScore: deterministic technical audio QA for EchoVault submissions. Not a copyright check."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1"
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
